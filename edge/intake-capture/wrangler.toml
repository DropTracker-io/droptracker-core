# Routes live in ONE place: [env.production] at the bottom of this file.
#
# The top level deliberately declares no route, so the default `wrangler deploy`
# target is a workers.dev-only worker under a different name. That is not a
# style preference -- named environments in Wrangler *inherit* `routes` from the
# top level (unlike vars and bindings, which they do not), so a top-level
# `routes` block silently attaches production traffic to whatever environment
# you deploy. On 2026-08-21 a `deploy --env staging` did exactly that and put an
# unvalidated worker in front of api.droptracker.io.
#
# Two names, one route block, no inheritance to reason about:
#   wrangler deploy                    -> droptracker-intake-capture-staging, no routes
#   wrangler deploy --env production   -> droptracker-intake-capture, live routes

name = "droptracker-intake-capture-staging"
main = "src/index.js"
compatibility_date = "2026-08-21"
workers_dev = true

[vars]
ORIGIN_HOST = "api-origin.droptracker.io"
ORIGIN_TIMEOUT_MS = "8000"
# No sampling in staging: every capture here should be one you caused.
FORCE_SPOOL_SAMPLE = "0"
# Staging shares the production origin, so it must never also mirror -- one
# submission reaching dev twice is noise nobody will think to explain. Empty
# means the Worker does not even fetch /edge-config. Leave it empty.
MIRROR_HOST = ""
MIRROR_TIMEOUT_MS = "5000"

[[r2_buckets]]
binding = "SPOOL"
bucket_name = "droptracker-intake-spool"

[[analytics_engine_datasets]]
binding = "LEDGER"
dataset = "droptracker_intake_staging"


# ---------------------------------------------------------------------------
# Production. The only place routes appear.
# ---------------------------------------------------------------------------
[env.production]
name = "droptracker-intake-capture"
workers_dev = false

# Scoped to the two submission routes only. The GET read traffic
# (/notifications, /panel_data, /event_state) is far higher volume and must stay
# on the plain proxy path -- routing it through a Worker multiplies cost for no
# durability benefit.
[[env.production.routes]]
pattern = "api.droptracker.io/webhook"
zone_name = "droptracker.io"

[[env.production.routes]]
pattern = "api.droptracker.io/submit"
zone_name = "droptracker.io"

[env.production.vars]
# Must NOT be api.droptracker.io, or the Worker's own fetch re-enters its route.
ORIGIN_HOST = "api-origin.droptracker.io"
# MUST stay under the plugin's 10s OkHttp read timeout. If the origin hangs
# rather than refusing, a Worker that waits longer than the client captures the
# submission and then answers 200 to nobody -- the plugin has already given up
# and will retry, producing one duplicate capture per attempt. Answering at 8s
# means the plugin hears the 200 and stops. A healthy acceptor replies in ~50ms
# and anything over 750ms is already logged as slow, so this cuts off nothing
# real.
ORIGIN_TIMEOUT_MS = "8000"
# Fraction of *successful* requests also written to R2, to keep the spool and
# drain paths exercised. GUID dedup makes the replay a no-op. ~370 objects/day.
FORCE_SPOOL_SAMPLE = "0.001"
# Where the dev copy goes. Two independent gates gate it, both shut by default:
# this var must be non-empty, AND redis edge:mirror must say enabled (the admin
# CP toggle, which self-expires). So deploying this as-is mirrors nothing.
#
# It is a deploy-time var rather than part of the polled config on purpose: the
# CP can turn mirroring on and off, but it can never aim it somewhere new, so
# a compromised or fat-fingered admin surface cannot redirect submissions.
# For a first deploy you want provably inert, override it:
#   npx wrangler deploy --env production --var MIRROR_HOST:''
MIRROR_HOST = "dev-api.droptracker.io"
# Well under ORIGIN_TIMEOUT_MS. The mirror is fire-and-forget, so this only
# bounds how long a stalled dev box can hold an isolate open in waitUntil.
MIRROR_TIMEOUT_MS = "5000"

[[env.production.r2_buckets]]
binding = "SPOOL"
bucket_name = "droptracker-intake-spool"

[[env.production.analytics_engine_datasets]]
binding = "LEDGER"
dataset = "droptracker_intake"
