# /img/ for the www and activity hosts. Installed as
# /etc/nginx/snippets/droptracker-img.conf and included in place of the old
# `location /img/` blocks in sites-available/default.
#
# Images that already exist on disk are served by nginx directly. Everything
# else (non-image ticket attachments, models/ and avatar crops, and anything
# missing that the app recovers on demand) still goes to the image routes in
# the core bot (web/front.py serve_img on :8080).
#
# Why: serve_img runs on the core bot's event loop, so a busy bot stalls image
# downloads. Discord reads an embed image's size once, when the message is
# posted. If that download is too slow it stores the image as 0x0, and the
# embed shows no image on every client. That happened to 8 of the 2026-10 clan
# recap posts.

location /img/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 24h;
    expires 24h;
    add_header Cache-Control "public, no-transform";

    # Same inline-image extensions serve_img renders (_INLINE_IMAGE_EXTS);
    # models/ stays on the app for the avatar alias and the B2 redirects.
    location ~* ^/img/(?!models/).+\.(?:png|jpe?g|gif|webp)$ {
        root /store/droptracker/disc/static/assets;
        try_files $uri @img_app;
        # A file www-data can't read goes to the app instead of a 403.
        error_page 403 = @img_app;
        expires 24h;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff;
    }
}

location @img_app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_cache_valid 200 24h;
    expires 24h;
    add_header Cache-Control "public, no-transform";
}
