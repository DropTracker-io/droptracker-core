# The intake API block, as it must appear in /etc/nginx/sites-available/default.
#
# Vendored for reference only -- the live copy is a block inside that untracked
# file, not a standalone include, so this is not a drop-in. Reconcile by hand
# and keep the two in step.
#
# Two things here are load-bearing and were both learned the hard way:
#
#   client_max_body_size  Was never set on this block, so it inherited nginx's
#                         1 MiB default while p99 screenshots were already
#                         514 KB. A body over the cap 413s, and the plugin
#                         retries a 413 ten times (terminal statuses are only
#                         400/401/403) before giving up ~17 minutes later, so
#                         the submission is lost after a lot of futile work.
#
#   api-origin server_name  The edge capture Worker (edge/intake-capture) has to
#                         fetch the origin under a name that is not its own
#                         route, or it re-enters itself. A Worker cannot set the
#                         Host header, so a second server_name is the fix.
#                         api-origin.droptracker.io is proxied at Cloudflare and
#                         carries NO Worker route.

server {
    listen 80;

    server_name api.droptracker.io api-origin.droptracker.io;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:31323;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
