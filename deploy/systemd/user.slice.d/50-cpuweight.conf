# Installed to /etc/systemd/system/user.slice.d/50-cpuweight.conf
#
# Interactive / agent work must never starve production services.
#
# Everything launched from an SSH or Claude Code session lands in user.slice;
# every droptracker-* service lands in system.slice. Both default to
# CPUWeight=100, so a single runaway user command competes with production on
# equal terms. On 2026-08-20 a stray `grep -rn <id> /` held 6 of 8 cores for
# 4+ hours, starving the core bot's asyncio loop badly enough that the Discord
# gateway heartbeat missed its 41s deadline repeatedly (~3.2 reconnects/hr vs
# ~0.8 baseline) and three stacked status sweeps posted duplicate cards.
#
# This is a WEIGHT, not a quota: on an idle box user sessions still get the
# whole machine. It only takes effect under contention, where user.slice now
# settles at ~1/3 of CPU instead of an equal split. Raise it back to 100 to
# restore the old behaviour.
[Slice]
CPUWeight=50
