# DropTracker DEV site.
# Canonical copy: disc/deploy/dev/nginx/dev.droptracker.io.conf
#
# Differs from production's sites-available/default on purpose:
#   * single Next.js colour (31380) - no blue-green upstream
#   * /img/ served from disk, not proxied to droptracker-core's :8080 Jinja app,
#     so restarting the bot cannot break the site's images
#   * X-Robots-Tag noindex everywhere - a public dev site outranking prod is a
#     real and avoidable embarrassment
#   * HTTP Basic auth as a stopgap gate. The intended gate is Cloudflare Access,
#     but the Cloudflare API token in prod's .env is expired, so DNS/Access could
#     not be configured. Remove the two auth_basic lines once Access is live.

upstream droptracker_node_dev {
    server 127.0.0.1:31380 max_fails=1 fail_timeout=5s;
}

limit_req_zone $binary_remote_addr zone=devapi:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dev.droptracker.io _;

    client_max_body_size 1024M;

    # Never let a dev instance into a search index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Stopgap gate until Cloudflare Access is configured.
    auth_basic           "DropTracker dev";
    auth_basic_user_file /etc/nginx/dev.htpasswd;

    # Generated and static art straight off disk.
    location /img/ {
        alias /store/droptracker/disc/static/assets/img/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "private, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    # RuneLite plugin intake. No basic auth - the plugin cannot answer a prompt.
    location /api/v1/webhook {
        auth_basic off;
        limit_req zone=devapi burst=60 nodelay;
        proxy_pass http://127.0.0.1:31323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # SSE - no buffering, long lived.
    location /api/stream {
        proxy_pass http://droptracker_node_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://droptracker_node_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
