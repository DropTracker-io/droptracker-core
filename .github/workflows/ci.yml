name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["new-api"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # -rs lists why anything skipped. A check that needs something a clean
      # checkout lacks turns itself off rather than failing, so without this the
      # log cannot tell "5200 passed" from "5200 passed and the parity checks
      # have not run since March".
      - name: Run unit tests
        run: python -m pytest tests/unit/ -q --tb=short -rs
