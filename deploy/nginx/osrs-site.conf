# Tenant mini-sites domain (osrs.site) — PRODUCTION.
# Vendored copy; install as /etc/nginx/sites-available/osrs-site with a
# symlink in sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Cloudflare zone: SSL mode MUST be Flexible (origin is HTTP-only :80; a
# new zone defaults to Full and yields 521s). Proxied A @ + A * records.
#
# Differences from the dev copy (deploy/dev nginx on the dev box):
#   * proxies to the blue-green upstream `droptracker_node` — NEVER a fixed
#     port, and NEVER edit conf.d/droptracker-node-upstream.conf (deploy.sh
#     regenerates it wholesale on every web deploy)
#   * /img/ proxied to droptracker-core's :8080 like www (prod's asset tree
#     is served by the bot's Jinja app, not straight off disk)
#   * no X-Robots-Tag noindex — per-site indexing is governed by the app
#     (needs_review flag + tenant robots.txt)

# www.osrs.site -> apex. Exact server_name beats the tenant regex block below,
# which would otherwise treat "www" as a clan subdomain and serve the
# "address not claimed" page. One canonical host keeps ranking signal in one
# place; 301 because this will not change.
server {
    listen 80;
    listen [::]:80;
    server_name www.osrs.site;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://osrs.site$request_uri;
    }

    return 301 https://osrs.site$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name osrs.site;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://droptracker_node;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<sub>[a-z0-9-]+)\.osrs\.site$;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 16M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Item/NPC/group art referenced relatively by tenant pages — same origin,
    # same upstream as www's /img/.
    location /img/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # SSE (live ticker) — unbuffered, long-lived.
    location /api/stream {
        proxy_pass http://droptracker_node;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://droptracker_node;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Site-Slug $sub;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90;
    }
}
