# DropTracker DEV API host — dev-api.droptracker.io
#
# The plugin's intake/read API, deliberately separate from the dev *site* block.
#
# The site sits behind HTTP Basic auth as a stopgap gate, which a RuneLite
# plugin can never satisfy: it has no way to answer a prompt, so every call it
# makes returns 401 and the failure looks like "the feature does not work".
# That is exactly what happened — /player/model, /load_config and
# /notifications were all 401ing while the site itself was fine.
#
# Giving the API its own server_name keeps the gate on the pages (where it
# matters, so a dev site cannot be browsed or indexed) while letting a client
# that was pointed here with ::debugurl actually talk to it.
#
# Canonical copy: disc/deploy/dev/nginx/dev-api.droptracker.io.conf

server {
    listen 80;
    listen [::]:80;
    server_name dev-api.droptracker.io;

    # Screenshots and character models are large multipart uploads.
    client_max_body_size 1024M;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;

    # No auth_basic: this vhost exists precisely so an unattended client can
    # reach the API. It is still a dev box behind a dev-only hostname, and it
    # is rate limited below.
    # Data API v2 (droptracker-data-api service) — own process, port 31326.
    location /v2/ {
        proxy_pass http://127.0.0.1:31326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location / {
        limit_req zone=devapi burst=60 nodelay;
        proxy_pass http://127.0.0.1:31323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-poll /notifications holds the request open server-side.
        proxy_read_timeout 90;
    }

    # Item/NPC icons and generated art, straight off disk — the plugin panel
    # loads these, and proxying them through the API would be pointless work.
    location /img/ {
        alias /store/droptracker/disc/static/assets/img/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "private, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }
}
