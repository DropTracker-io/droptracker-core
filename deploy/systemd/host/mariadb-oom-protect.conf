# Keep the database off the OOM killer's shortlist.
#
# 2026-08-02: runaway test processes exhausted the box and the kernel killed
# mariadbd — not because the database misbehaved, but because at ~19 GiB RSS
# (16 GiB buffer pool) it is always the single largest process, and the OOM
# killer scores by size. Losing it took the intake API down with it and cost
# 2h31m of submissions.
#
# A negative OOMScoreAdjust tells the kernel to prefer almost anything else.
# This does NOT make the database immune, and it is not a substitute for
# bounding the things that actually leak (see the user.slice cap) — it just
# means the process everything else depends on is no longer the default victim.
[Service]
OOMScoreAdjust=-800
